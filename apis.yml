aid: anker-innovations
name: Anker Innovations
description: 'Anker Innovations is a global consumer-electronics company headquartered in Shenzhen,
  China, known for its Anker charging and power products, Soundcore audio, eufy smart-home and
  security devices, Nebula projectors, and Anker SOLIX portable power and solar storage. Through
  the Anker Open Platform (developer.anker.com) the company exposes a developer surface that lets
  partners integrate and control Anker devices from their own applications via API and SDK, gated
  behind an Open Platform login. This profile was surfaced as a portfolio company of IDG Capital
  and is being enriched with the API Evangelist pipeline.'
